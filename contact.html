<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Swikar Shipping Services</title><meta name="description" content="Custom clearance, PAN India transportation and freight forwarding from Mundra, Kandla, Ahmedabad and Nhava Sheva."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><nav id="nav"></nav>
<header class="wrap ph"><h1>Get a quote.</h1><p>Tell us what you're moving and where. We'll come back with a quote.</p></header>
<section class="sec wrap cols" id="quote" style="padding-top:40px">
<form id="qf" class="form">
<div class="two"><div><label for="n">Name</label><input id="n" name="name" required></div><div><label for="e">Email</label><input id="e" name="email" type="email" required></div></div>
<div class="two"><div><label for="ph">Phone</label><input id="ph" name="phone"></div><div><label for="s">Service</label><select id="s" name="service"><option>Custom clearance</option><option>Transportation (PAN India)</option><option>Freight forwarding</option></select></div></div>
<div class="two"><div><label for="f">From</label><input id="f" name="from" required></div><div><label for="t">To</label><input id="t" name="to" required></div></div>
<div><label for="p">Port</label><select id="p" name="port"><option>Mundra</option><option>Kandla</option><option>Ahmedabad (ICD/Airport)</option><option>Nhava Sheva</option></select></div>
<div><label for="d">Cargo details</label><textarea id="d" name="details" rows="4"></textarea></div>
<button class="btn" style="justify-self:start">Send quote request</button>
<p class="ok" hidden>Your email app is opening with the request filled in. Press send there.</p></form>
<div><h2>Ports we serve</h2><p style="margin-top:16px">Mundra, Kandla, Ahmedabad (ICD/Airport) and Nhava Sheva.</p>

</div></section>
